name: Bug Report
description: Report a bug in KodaCode
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: KodaCode version
      description: Run `kodacode --version` and paste the output.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (arm64)
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: Which provider and model were you using when the bug occurred?
      placeholder: "anthropic/claude-sonnet-4-6"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of what happened.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start kodacode in a Go project
        2. Type "..."
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Paste a screenshot showing the issue. Drag and drop an image here.
      placeholder: Drag and drop a screenshot here or paste an image.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste any relevant log output from `$TMPDIR/koda.log`.
        Run `cat $TMPDIR/koda.log | tail -50` to get the last 50 lines.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Config excerpt
      description: |
        Paste the relevant parts of your config (redact API keys).
        Only include sections related to the bug.
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have included a screenshot
          required: true
