<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KodaCode brand image</title>
  <desc id="desc">KodaCode wordmark with a terminal product interface.</desc>
  <defs>
