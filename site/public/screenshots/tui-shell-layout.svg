  <text x="31" y="232" font-family="JetBrains Mono, monospace" font-size="16" fill="#777489">Audit the repository's database indexes and query patterns. Identify existing MongoDB/Mongoose indexes, how they align with filters/sorts/uniqueness constraints, any missing or</text>
