      .logo-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace; font-size: 16px; font-weight: 700; }
      .tagline { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace; font-size: 13px; fill: #89b4fa; }
    </style>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="30%" stop-color="#cba6f7"/>
      <stop offset="45%" stop-color="#89b4fa"/>
      <stop offset="55%" stop-color="#89b4fa"/>
      <stop offset="70%" stop-color="#cba6f7"/>
