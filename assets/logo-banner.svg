<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700');
      .logo-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace; font-size: 18px; font-weight: 700; }
      .tagline { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace; font-size: 15px; fill: #a6adc8; font-weight: 400; }
      .badge { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace; font-size: 11px; fill: #1e1e2e; font-weight: 700; }
    </style>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="35%" stop-color="#cba6f7"/>
      <stop offset="45%" stop-color="#89b4fa"/>
      <stop offset="55%" stop-color="#89b4fa"/>
      <stop offset="65%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#cba6f7"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="16" fill="#1e1e2e"/>
  <!-- Subtle corner glow -->
  <circle cx="0" cy="0" r="200" fill="#cba6f7" opacity="0.03"/>
  <circle cx="800" cy="300" r="200" fill="#89b4fa" opacity="0.03"/>
  <!-- Logo -->
  <text fill="url(#grad)" xml:space="preserve" style="font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace; font-size: 18px; font-weight: 700;">
    <tspan x="130" dy="70">  _  __         _          ____          _</tspan>
    <tspan x="130" dy="24"> | |/ /___   __| | __ _   / ___|___   __| | ___</tspan>
    <tspan x="130" dy="24"> | ' // _ \ / _` |/ _` | | |   / _ \ / _` |/ _ \</tspan>
    <tspan x="130" dy="24"> | . \ (_) | (_| | (_| | | |__| (_) | (_| |  __/</tspan>
    <tspan x="130" dy="24"> |_|\_\___/ \__,_|\__,_|  \____\___/ \__,_|\___|</tspan>
  </text>
  <!-- Tagline -->
  <text class="tagline" x="400" y="215" text-anchor="middle">The composable AI coding agent for your terminal</text>
  <!-- Feature pills -->
  <g transform="translate(400, 255)">
    <rect x="-310" y="-14" width="120" height="24" rx="12" fill="#cba6f7" opacity="0.15"/>
    <text x="-250" y="3" text-anchor="middle" fill="#cba6f7" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">Multi-provider</text>
    <rect x="-170" y="-14" width="90" height="24" rx="12" fill="#89b4fa" opacity="0.15"/>
    <text x="-125" y="3" text-anchor="middle" fill="#89b4fa" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">20+ tools</text>
    <rect x="-60" y="-14" width="100" height="24" rx="12" fill="#a6e3a1" opacity="0.15"/>
    <text x="-10" y="3" text-anchor="middle" fill="#a6e3a1" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">Sandboxed</text>
    <rect x="60" y="-14" width="100" height="24" rx="12" fill="#f9e2af" opacity="0.15"/>
    <text x="110" y="3" text-anchor="middle" fill="#f9e2af" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">Extensible</text>
    <rect x="180" y="-14" width="120" height="24" rx="12" fill="#f38ba8" opacity="0.15"/>
    <text x="240" y="3" text-anchor="middle" fill="#f38ba8" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">Agent system</text>
  </g>
</svg>
