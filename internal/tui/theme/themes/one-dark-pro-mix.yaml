name: one-dark-pro-mix
syntax_style: one-dark-pro-mix

palette:
  primary: "#61afef"
  secondary: "#56b6c2"
  surface: "#282c34"
  overlay: "#21252b"
  text: "#abb2bf"
  subtext: "#9da5b4"
  error: "#e06c75"
  warning: "#d19a66"
  success: "#98c379"
  thinking: "#c678dd"

tones:
  bg: "#282c34"
  bg-alt: "#21252b"
  panel: "#21252b"
  panel-alt: "#2c313c"
  line: "#3e4452"
  line-strong: "#5c6370"
  soft: "#9da5b4"

components:
  panel:
    bg: panel
    fg: text
    border: rounded
    border-color: line
    padding: [0, 1]
  permission:
    bg: panel-alt
    fg: text
    border: rounded
    border-color: primary
    padding: [0, 1]
  selection:
    bg: primary
    fg: surface
  hint:
    fg: subtext
  status-running:
    fg: warning
  status-done:
    fg: success
  status-error:
    fg: error
