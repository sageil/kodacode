# Tokyo Night — https://github.com/enkia/tokyo-night-vscode-theme
# Soft dark theme with blue undertones inspired by Tokyo city lights.
name: tokyo-night
syntax_style: tokyonight-night

palette:
  # Blue (#7aa2f7) — primary interactive elements and headings.
  primary: "#7aa2f7"
  # Cyan (#7dcfff) — secondary accents, links, badges.
  secondary: "#7dcfff"
  # Surface (#24283b) — raised surfaces, panels, dialogs.
  surface: "#24283b"
  # Overlay (#414868) — input areas, selection highlights.
  overlay: "#414868"
  # Foreground (#c0caf5) — primary readable text.
  text: "#c0caf5"
  # Comment (#565f89) — de-emphasised labels, hints.
  subtext: "#565f89"
  # Red (#f7768e) — errors and destructive actions.
  error: "#f7768e"
  # Yellow (#e0af68) — warnings and caution states.
  warning: "#e0af68"
  # Green (#9ece6a) — success states and completion ticks.
  success: "#9ece6a"
  thinking: "#bb9af7"

components:
  user-message:
    fg: "#c0caf5"
    bg: "#414868"
    border: left
    border-color: "#7aa2f7"

  assistant-message:
    fg: "#c0caf5"
