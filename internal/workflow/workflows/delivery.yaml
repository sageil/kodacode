id: delivery
description: Plan, implement, verify, and review a code change.
review_mode: auto
max_revision_loops: 2

phases:
  - id: plan
    agent: planner
    mode: read_only
    requires_output:
      - plan
      - affected_files
      - risks

  - id: approve
    type: user_approval
    prompt: Approve this plan before edits?
    skip_when:
      max_affected_files: 2

  - id: implement
    agent: engineer
    tools:
      allow:
        - read
        - search
        - apply_patch
        - bash
        - git_diff
        - task_workflow
    requires:
      approved_phase: plan
    completion:
      requires:
        - active_phase_tasks_complete

  - id: verify
    type: verification
    agent: engineer
    prompt: Run the declared verification commands and report the result.
    tools:
      allow:
        - test
        - bash
    commands:
      - tool: test
        command: go test ./...
    required: true

  - id: review
    type: review
    agent: reviewer
    mode: read_only
    review_passes:
      - id: correctness
        description: Correctness against the request and approved plan.
        instructions:
          - Compare behavior with the approved plan and request.
          - Check the main path and important edge cases.
          - Find incorrect, incomplete, or out-of-scope behavior.
      - id: tests
        description: Tests, edge cases, and missing checks.
        instructions:
          - Inspect tests changed or affected.
          - Check coverage for behavior, edge cases, and declared verification.
          - Find missing, brittle, unrelated, or non-exercising tests.
      - id: architecture
        description: APIs, data, config, permissions, and compatibility.
        instructions:
          - Inspect APIs, request/response shapes, persisted data, config, permissions, and integrations.
          - Check callers, stored data, config, and related modules.
          - Find broken callers, incompatible data changes, permission/config risk, or maintainability issues.
    requires:
      - git_diff
      - verification_result

  - id: summarize
    type: final
    include:
      - changed_files
      - verification_result
      - review_outcome
      - unresolved_risks

transitions:
  - from: approve
    on: skipped
    to: implement
  - from: verify
    on: verification_failed
    to: implement
    max_loops: 2
  - from: review
    on: review_failed
    to: implement
    max_loops: 2
