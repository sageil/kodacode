id: delivery
description: Plan, implement, verify, and review a code change.
review_mode: auto
max_revision_loops: 2

phases:
  - id: plan
    agent: planner
    mode: read_only
    requires_output:
      - plan
      - affected_files
      - risks

  - id: approve
    type: user_approval
    prompt: Approve this plan before edits?
    skip_when:
      max_affected_files: 2

  - id: implement
    agent: engineer
    tools:
      allow:
        - read
        - search
        - apply_patch
        - bash
        - git_diff
        - task_workflow
    requires:
      approved_phase: plan

  - id: verify
    type: verification
    agent: engineer
    prompt: Run the declared verification commands and report the result.
    tools:
      allow:
        - test
        - bash
    commands:
      - go test ./...
    required: true

  - id: review
    agent: reviewer
    mode: read_only
    review_passes:
      - id: correctness
        description: Behavioral regressions and implementation correctness.
      - id: tests
        description: Verification coverage, edge cases, and missing checks.
      - id: contracts
        description: API, config, permission, and compatibility contracts.
    requires:
      - git_diff
      - verification_result

  - id: summarize
    type: final
    include:
      - changed_files
      - verification_result
      - review_outcome
      - unresolved_risks

transitions:
  - from: approve
    on: skipped
    to: implement
  - from: verify
    on: verification_failed
    to: implement
    max_loops: 2
  - from: review
    on: review_failed
    to: implement
    max_loops: 2
