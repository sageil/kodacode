id: delivery
description: Plan, implement, and review a code change.
review_mode: auto
max_revision_loops: 2

phases:
  - id: plan
    agent: planner
    mode: read_only
    requires_output:
      - plan
      - affected_files
      - risks
      - implementation_tasks
      - acceptance_criteria
      - verification_plan

  - id: approve
    type: user_approval
    prompt: Approve this plan before edits?
    skip_when:
      max_affected_files: 2

  - id: implement
    agent: engineer
    tools:
      allow:
        - read
        - search
        - apply_patch
        - write
        - bash
        - task_workflow
    requires:
      approved_phase: plan
    completion:
      requires:
        - file_mutation

  - id: review
    type: review
    agent: reviewer
    mode: read_only
    tools:
      allow:
        - read
        - search
        - test
        - git_status
        - workflow_review_result
    review_passes:
      - id: correctness
        description: Correctness against the request and approved plan.
        instructions:
          - Compare behavior with the approved plan and request.
          - Check the main path and important edge cases.
          - Find incorrect, incomplete, or out-of-scope behavior.
      - id: verification
        description: Verification against acceptance criteria and the approved verification plan.
        instructions:
          - Check the implemented change against the approved acceptance_criteria and verification_plan.
          - Run or inspect the most relevant bounded tests through the test tool when useful.
          - Find failed, missing, weak, or skipped verification.
      - id: tests
        description: Tests, edge cases, and missing checks.
        instructions:
          - Inspect tests changed or affected.
          - Check coverage for behavior, edge cases, and review verification.
          - Find missing, brittle, unrelated, or non-exercising tests.
      - id: architecture
        description: APIs, data, config, permissions, and compatibility.
        instructions:
          - Inspect APIs, request/response shapes, persisted data, config, permissions, and integrations.
          - Check callers, stored data, config, and related modules.
          - Find broken callers, incompatible data changes, permission/config risk, or maintainability issues.
  - id: summarize
    type: final
    include:
      - changed_files
      - review_outcome
      - unresolved_risks

transitions:
  - from: approve
    on: skipped
    to: implement
  - from: review
    on: review_failed
    to: implement
    max_loops: 2
