id: debug
description: Reproduce, identify, patch, verify, and review a bug fix.
review_mode: auto
max_revision_loops: 2

phases:
  - id: reproduce
    agent: engineer
    prompt: Reproduce the reported failure or capture the closest concrete signal before patching.
    tools:
      allow:
        - read
        - search
        - bash
        - test
        - diagnostics
        - git_diff
        - task_workflow

  - id: identify
    agent: planner
    mode: read_only
    prompt: Find the likely cause, the code area involved, and the smallest useful change.

  - id: patch
    agent: engineer
    prompt: Fix the cause and record useful task progress.
    tools:
      allow:
        - read
        - search
        - apply_patch
        - bash
        - test
        - diagnostics
        - git_diff
        - task_workflow

  - id: regression
    agent: engineer
    prompt: Add or update a test when there is a good place for one.
    tools:
      allow:
        - read
        - search
        - apply_patch
        - bash
        - test
        - diagnostics
        - git_diff
        - task_workflow

  - id: verify
    type: verification
    agent: engineer
    prompt: Run the declared verification commands and report the result.
    tools:
      allow:
        - test
        - bash
    commands:
      - tool: test
        command: go test ./...
    required: true

  - id: review
    type: review
    agent: reviewer
    mode: read_only
    review_passes:
      - id: cause
        description: Whether the patch fixes the reproduced cause.
      - id: regression
        description: Test coverage and edge cases for the failure.
      - id: side-effects
        description: Side effects in nearby code, config, or permissions.
    requires:
      - verification_result

  - id: summarize
    type: final
    include:
      - failure_signal
      - root_cause
      - changed_files
      - verification_result
      - review_outcome

transitions:
  - from: verify
    on: verification_failed
    to: patch
    max_loops: 2
  - from: review
    on: review_failed
    to: patch
    max_loops: 2
