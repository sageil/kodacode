id: review
description: Read-only review for current changes, possible bugs, and shipping risks.
review_mode: manual

phases:
  - id: inspect
    agent: reviewer
    mode: read_only
    prompt: Inspect the relevant diff, files, tests, and session context before reporting findings.

  - id: review
    type: review
    agent: reviewer
    mode: read_only
    prompt: Record concrete review findings or a saved pass, concern, or fail result.
    review_passes:
      - id: correctness
        description: Behavior changes and whether the implementation is correct.
      - id: tests
        description: Test coverage, edge cases, and missing checks.
      - id: architecture
        description: APIs, config, permissions, compatibility, and system boundaries.

  - id: summarize
    type: final
    include:
      - review_outcome
      - findings
      - evidence
      - unresolved_risks
